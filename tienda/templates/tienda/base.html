<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tienda Deportiva{% endblock %}</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fuente moderna (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col justify-between selection:bg-red-500 selection:text-white">

<!-- Navegación Moderna Estilo Flotante -->
<header class="sticky top-0 z-50 backdrop-blur-md bg-black/70 border-b border-gray-800/80">
    <nav class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
        <!-- Menú Enlaces estilo Píldora -->
        <div class="flex items-center space-x-2">
            <a href="{% url 'tienda:inicio' %}" class="px-4 py-2 rounded-full text-sm font-medium hover:bg-gray-800 text-gray-300 hover:text-white transition-all duration-300">
                Inicio
            </a>
            <a href="{% url 'tienda:catalogo' %}" class="px-4 py-2 rounded-full text-sm font-medium hover:bg-gray-800 text-gray-300 hover:text-white transition-all duration-300">
                Catálogo
            </a>
            <!-- Botón de Carrito integrado con Contador -->
            <a href="{% url 'tienda:detalle_carrito' %}" class="px-4 py-2 rounded-full text-sm font-medium hover:bg-gray-800 text-gray-300 hover:text-white transition-all duration-300 flex items-center gap-2">
                <span>🛒 Carrito</span>
                {% if request.session.carrito_compras %}
                <span class="bg-red-600 text-white text-[10px] font-extrabold px-2 py-0.5 rounded-full shadow-md">
                        {{ request.session.carrito_compras|length }}
                    </span>
                {% endif %}
            </a>
        </div>

        <!-- Botón Admin Estilo Glow Redondeado -->
        <div>
            <a href="/admin/" class="px-5 py-2.5 rounded-full text-xs uppercase tracking-wider font-bold bg-gradient-to-r from-red-600 to-red-500 hover:from-red-500 hover:to-red-400 text-white shadow-lg shadow-red-900/30 hover:shadow-red-600/50 hover:scale-105 active:scale-95 transition-all duration-300">
                Panel Admin
            </a>
        </div>
    </nav>
</header>

<!-- Contenido Principal -->
<main class="max-w-7xl mx-auto px-6 py-8 flex-grow w-full">
    {% block content %}{% endblock %}
</main>

<!-- Pie de página Elegante -->
<footer class="border-t border-gray-800 bg-black/50 py-8 text-center text-sm text-gray-500 mt-16">
    <p>&copy; 2026 Tienda Deportiva. Calidad & Estilo Premium.</p>
</footer>

</body>
</html>
