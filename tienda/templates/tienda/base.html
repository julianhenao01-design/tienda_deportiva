<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Velo Kicks | Tienda de Vanguardia{% endblock %}</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fuente moderna (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Fondo base oscuro */
            background-color: #050510;
        }

        /* Capa de fondo animada con luces de neón (Cian y Magenta) */
        .neon-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background:
                    radial-gradient(circle at 15% 50%, rgba(255, 0, 255, 0.15), transparent 40%),
                    radial-gradient(circle at 85% 30%, rgba(0, 255, 255, 0.2), transparent 40%),
                    radial-gradient(circle at 50% 100%, rgba(0, 255, 255, 0.1), transparent 50%);
            background-size: 200% 200%;
            animation: moveLights 15s ease-in-out infinite alternate;
        }

        @keyframes moveLights {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        /* Utilidad para efecto de vidrio esmerilado (Glassmorphism) */
        .glass-panel {
            background: rgba(10, 10, 20, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="text-gray-100 min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-white relative">

<!-- Capa de fondo Neón -->
<div class="neon-background"></div>

<!-- Navegación Efecto Vidrio (Glassmorphism) -->
<header class="sticky top-0 z-50 glass-panel border-b border-white/10 shadow-[0_4px_30px_rgba(0,0,0,0.5)]">
    <nav class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">

        <!-- LOGO Velo Kicks -->
        <a href="{% url 'tienda:inicio' %}" class="flex items-center gap-2">
            <span class="text-2xl md:text-3xl font-black italic tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-fuchsia-500 drop-shadow-[0_0_8px_rgba(0,255,255,0.6)]">
                DUAL SHOES
            </span>
        </a>

        <!-- Menú Enlaces estilo Píldora -->
        <div class="hidden md:flex items-center space-x-1">
            <a href="{% url 'tienda:inicio' %}" class="px-5 py-2 rounded-full text-sm font-semibold hover:bg-white/10 text-gray-300 hover:text-cyan-400 transition-all duration-300">
                Inicio
            </a>
            <a href="{% url 'tienda:catalogo' %}" class="px-5 py-2 rounded-full text-sm font-semibold hover:bg-white/10 text-gray-300 hover:text-cyan-400 transition-all duration-300">
                Catálogo
            </a>
        </div>

        <!-- Botones de Acción (Carrito y Admin) -->
        <div class="flex items-center space-x-3">
            <!-- Carrito Estilo Neón -->
            <a href="{% url 'tienda:detalle_carrito' %}" class="px-4 py-2 rounded-full text-sm font-bold border border-cyan-500/30 bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-300 hover:text-cyan-100 transition-all duration-300 flex items-center gap-2 shadow-[0_0_10px_rgba(0,255,255,0.2)]">
                <span>🛒</span>
                {% if request.session.carrito_compras %}
                <span class="bg-fuchsia-600 text-white text-[10px] font-extrabold px-2 py-0.5 rounded-full shadow-[0_0_8px_rgba(255,0,255,0.8)]">
                        {{ request.session.carrito_compras|length }}
                    </span>
                {% endif %}
            </a>

            <!-- Botón Admin Glow Magenta -->
            <a href="/admin/" class="hidden md:block px-5 py-2.5 rounded-full text-xs uppercase tracking-wider font-bold bg-gradient-to-r from-fuchsia-600 to-pink-500 hover:from-pink-500 hover:to-fuchsia-400 text-white shadow-[0_0_15px_rgba(255,0,255,0.5)] hover:shadow-[0_0_25px_rgba(255,0,255,0.7)] hover:scale-105 active:scale-95 transition-all duration-300">
                Panel Admin
            </a>
        </div>
    </nav>
</header>

<!-- Contenido Principal -->
<main class="max-w-7xl mx-auto px-6 py-8 flex-grow w-full z-10 relative">
    {% block content %}{% endblock %}
</main>

<!-- Pie de página -->
<footer class="glass-panel border-t border-white/10 py-8 text-center text-sm text-gray-500 mt-16 z-10 relative">
    <p>&copy; 2026 <span class="text-cyan-400 font-bold">DUALSHOES</span>. La evolución del estilo.</p>
</footer>

</body>
</html>
