<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DUAL SHOES | Tienda de Vanguardia{% endblock %}</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fuente moderna de alta definición (Plus Jakarta Sans) -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #FAFAFA; /* Blanco cálido suave */
            color: #0F172A; /* Negro / Slate oscuro de máxima definición */
        }

        /* Panel de navegación transparente efecto vidrio claro */
        .glass-panel-light {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }
    </style>
</head>
<body class="text-slate-900 min-h-screen flex flex-col justify-between selection:bg-slate-900 selection:text-white relative antialiased">

<!-- Navegación Efecto Vidrio Claro -->
<header class="sticky top-0 z-50 glass-panel-light shadow-sm">
    <nav class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">

        <!-- LOGO DUAL SHOES -->
        <a href="{% url 'tienda:inicio' %}" class="flex items-center gap-2 group">
            <span class="text-2xl md:text-3xl font-black tracking-tight text-slate-900 group-hover:text-slate-700 transition-colors uppercase">
                DUAL <span class="text-slate-500 font-extrabold">SHOES</span>
            </span>
        </a>

        <!-- Menú Enlaces -->
        <div class="hidden md:flex items-center space-x-2">
            <a href="{% url 'tienda:inicio' %}" class="px-5 py-2 rounded-full text-xs font-bold uppercase tracking-wider text-slate-700 hover:text-slate-900 hover:bg-slate-100 transition-all duration-200">
                Inicio
            </a>
            <a href="{% url 'tienda:catalogo' %}" class="px-5 py-2 rounded-full text-xs font-bold uppercase tracking-wider text-slate-700 hover:text-slate-900 hover:bg-slate-100 transition-all duration-200">
                Catálogo
            </a>
        </div>

        <!-- Botones de Acción (Carrito y Admin) -->
        <div class="flex items-center space-x-3">
            <!-- Carrito Estilo Claro -->
            <a href="{% url 'tienda:detalle_carrito' %}" class="px-4 py-2 rounded-full text-sm font-bold border border-slate-200 bg-white hover:bg-slate-100 text-slate-800 transition-all duration-200 flex items-center gap-2 shadow-sm">
                <span>🛒</span>
                {% if request.session.carrito_compras %}
                <span class="bg-slate-900 text-white text-[10px] font-black px-2 py-0.5 rounded-full shadow-sm">
                    {{ request.session.carrito_compras|length }}
                </span>
                {% endif %}
            </a>

            <!-- Botón Admin Premium Negro -->
            <a href="/admin/" class="hidden md:block px-5 py-2.5 rounded-full text-xs uppercase tracking-wider font-bold bg-slate-900 hover:bg-slate-800 text-white shadow-md shadow-slate-900/10 hover:shadow-lg hover:scale-105 active:scale-95 transition-all duration-200">
                Panel Admin
            </a>
        </div>
    </nav>
</header>

<!-- Contenido Principal -->
<main class="max-w-7xl mx-auto px-6 py-8 flex-grow w-full z-10 relative">
    {% block content %}{% endblock %}
</main>

<!-- Pie de página -->
<footer class="bg-white border-t border-slate-200 py-8 text-center text-sm text-slate-500 mt-16 z-10 relative">
    <p>&copy; 2026 <strong class="text-slate-900">DUALSHOES</strong>. La evolución del estilo.</p>
</footer>

</body>
</html>
